model = "gpt-6.2-sol"
model_reasoning_effort = "low"
review_model = "gpt-6.2-sol"

[agents]
enabled = true
max_depth = 1
max_concurrent_threads_per_session = 8
default_subagent_reasoning_effort = "high"

[features.multi_agent_v2]
tool_namespace = "collaboration"

[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/.codex/model-routing.py"'

[[hooks.PreToolUse]]
matcher = "^(spawn_agent|collaborationspawn_agent|Bash|apply_patch|Edit|Write)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/.codex/model-routing.py"'

[[hooks.PostToolUse]]
matcher = "^(spawn_agent|collaborationspawn_agent)$"

[[hooks.PostToolUse.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/.codex/model-routing.py"'

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/.codex/model-routing.py"'
