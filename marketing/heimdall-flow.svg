<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
<title id="title">Heimdall: the guarded crossing, from intent to evidence</title>
<desc id="desc">An architectural illustration of a physically supported stone viaduct joining a guarded hall on one cliff with a watchpost on the other. Below the illustration, a separate four-step workflow reads: Intent, Source paths, Focused change, Evidence. Evidence includes failures and unknowns.</desc>

